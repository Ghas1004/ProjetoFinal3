<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Zé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toldo">
        <h1>Loja do Zé</h1>
        <p>Cadastro e gerenciamento de categorias</p>
    </header>

    <main class="paginas">
        <section class="bloco" aria-labelledby="titulo-categoria">
            <h2 id="titulo-categoria">Nova categoria</h2>
            <form id="form-categoria" class="formulario">
                <input type="hidden" id="categoria-id">
                <input type="text" id="descricao" placeholder="Ex.: Brinquedos" aria-label="Nome da categoria" required>
                <div class="acoes">
                    <button type="submit" id="btn-categoria">Cadastrar</button>
                    <button type="button" id="btn-cancelar-categoria" class="secundario" hidden>Cancelar</button>
                </div>
            </form>
            <p id="mensagem" class="mensagem" role="status"></p>

            <h2>Categorias</h2>
            <ul id="lista-categorias" class="lista"></ul>
        </section>


    </main>

    <!-- http://localhost:3001 -->
    <script src="script.js"></script>
</body>
</html>
